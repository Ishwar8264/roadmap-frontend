<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7ed"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fef2f2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#9a3412" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#ea580c"/>
    </marker>
    <style>
      .title { font: 800 34px Inter, Arial, sans-serif; fill: #7c2d12; }
      .sub { font: 500 15px Inter, Arial, sans-serif; fill: #9a3412; }
      .h { font: 800 18px Inter, Arial, sans-serif; fill: #7c2d12; }
      .t { font: 500 13px Inter, Arial, sans-serif; fill: #431407; }
      .small { font: 600 12px Inter, Arial, sans-serif; fill: #9a3412; }
      .code { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7c2d12; }
      .card { fill: url(#card); stroke: #fed7aa; stroke-width: 1.5; filter: url(#shadow); }
      .soft { fill: #ffedd5; stroke: #fdba74; stroke-width: 1.2; }
      .line { stroke: #ea580c; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 10; marker-end: url(#arrow); animation: dash 2.7s linear infinite; }
      .line2 { stroke: #fb923c; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 7 9; marker-end: url(#arrow); animation: dash 3.4s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .float { animation: float 4s ease-in-out infinite; }
      .shake { animation: shake 3.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .fade { animation: fade 3s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -72; } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.04); opacity: .86; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes shake { 0%,100% { transform: rotate(0deg); } 45% { transform: rotate(-1.8deg); } 55% { transform: rotate(1.8deg); } }
      @keyframes fade { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>

  <text x="60" y="64" class="title">Rollup Bundler Flow</text>
  <text x="60" y="92" class="sub">Best for npm packages, UI libraries, SDKs, tree-shaking, and clean ESM/CJS/UMD output.</text>

  <g class="float">
    <rect x="55" y="132" width="220" height="150" rx="22" class="card"/>
    <text x="82" y="168" class="h">1. Source Code</text>
    <text x="82" y="198" class="code">src/index.ts</text>
    <text x="82" y="222" class="code">src/button.tsx</text>
    <text x="82" y="246" class="code">src/utils.ts</text>
    <text x="82" y="266" class="small">Your library files</text>
  </g>

  <line x1="280" y1="207" x2="365" y2="207" class="line"/>

  <g class="pulse">
    <rect x="375" y="122" width="235" height="170" rx="24" class="card"/>
    <text x="405" y="158" class="h">2. Entry Point</text>
    <rect x="405" y="181" width="160" height="42" rx="12" class="soft"/>
    <text x="428" y="207" class="code">input: index.ts</text>
    <text x="405" y="246" class="t">Rollup starts here and</text>
    <text x="405" y="267" class="t">follows all imports.</text>
  </g>

  <line x1="615" y1="207" x2="700" y2="207" class="line"/>

  <g>
    <rect x="710" y="112" width="250" height="190" rx="24" class="card"/>
    <text x="740" y="148" class="h">3. Dependency Graph</text>
    <circle cx="825" cy="190" r="22" fill="#fed7aa" stroke="#fb923c"/>
    <text x="808" y="195" class="code">index</text>
    <circle cx="765" cy="250" r="22" fill="#ffedd5" stroke="#fb923c"/>
    <text x="750" y="255" class="code">btn</text>
    <circle cx="885" cy="250" r="22" fill="#ffedd5" stroke="#fb923c"/>
    <text x="864" y="255" class="code">utils</text>
    <line x1="810" y1="205" x2="780" y2="235" stroke="#ea580c" stroke-width="2"/>
    <line x1="840" y1="205" x2="870" y2="235" stroke="#ea580c" stroke-width="2"/>
    <text x="740" y="282" class="small">Imports become a graph</text>
  </g>

  <line x1="835" y1="308" x2="835" y2="380" class="line"/>

  <g class="shake">
    <rect x="330" y="390" width="255" height="180" rx="24" class="card"/>
    <text x="360" y="426" class="h">4. Plugins</text>
    <text x="360" y="458" class="t">Transform different files:</text>
    <rect x="360" y="478" width="170" height="30" rx="10" class="soft"/>
    <text x="378" y="498" class="code">TS → JS</text>
    <rect x="360" y="516" width="170" height="30" rx="10" class="soft"/>
    <text x="378" y="536" class="code">JSX → JS</text>
    <text x="360" y="558" class="small">resolve, commonjs, typescript</text>
  </g>

  <line x1="710" y1="450" x2="595" y2="480" class="line2"/>
  <line x1="590" y1="480" x2="650" y2="480" class="line"/>

  <g class="pulse">
    <rect x="660" y="390" width="265" height="180" rx="24" class="card"/>
    <text x="690" y="426" class="h">5. Tree-Shaking</text>
    <text x="690" y="458" class="t">Unused exports are removed.</text>
    <rect x="690" y="482" width="92" height="34" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="711" y="504" class="code" fill="#166534">used()</text>
    <rect x="798" y="482" width="105" height="34" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="814" y="504" class="code" fill="#991b1b">unused()</text>
    <line x1="806" y1="516" x2="895" y2="482" stroke="#dc2626" stroke-width="3"/>
    <text x="690" y="548" class="small">Smaller and cleaner output</text>
  </g>

  <line x1="930" y1="480" x2="1010" y2="480" class="line"/>

  <g>
    <rect x="1015" y="375" width="135" height="210" rx="24" class="card"/>
    <text x="1042" y="411" class="h">6. Dist</text>
    <rect x="1040" y="436" width="88" height="34" rx="10" class="soft"/>
    <text x="1057" y="458" class="code">ESM</text>
    <rect x="1040" y="484" width="88" height="34" rx="10" class="soft"/>
    <text x="1057" y="506" class="code">CJS</text>
    <rect x="1040" y="532" width="88" height="34" rx="10" class="soft"/>
    <text x="1057" y="554" class="code">UMD</text>
  </g>

  <g class="fade">
    <rect x="55" y="625" width="1090" height="74" rx="22" fill="#431407" opacity="0.94"/>
    <text x="86" y="655" font-family="Inter, Arial" font-size="18" font-weight="800" fill="#fff7ed">Simple Rule</text>
    <text x="86" y="682" font-family="Inter, Arial" font-size="16" font-weight="600" fill="#fed7aa">Website/App → Vite or Next.js  •  Reusable npm package/library → Rollup</text>
  </g>

  <g>
    <rect x="80" y="330" width="190" height="190" rx="24" fill="#fff" stroke="#fed7aa" filter="url(#shadow)"/>
    <text x="108" y="366" class="h">External</text>
    <text x="108" y="398" class="t">Do not bundle peer</text>
    <text x="108" y="419" class="t">dependencies like:</text>
    <rect x="108" y="445" width="105" height="32" rx="10" class="soft"/>
    <text x="128" y="466" class="code">react</text>
    <text x="108" y="498" class="small">Avoid duplicate React</text>
  </g>

  <line x1="270" y1="425" x2="330" y2="455" class="line2"/>
</svg>
