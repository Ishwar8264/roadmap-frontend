<svg width="1100" height="720" viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="720" fill="#0f172a"/>

  <style>
    .title { font: bold 30px Arial; fill: #fff; }
    .sub { font: 16px Arial; fill: #cbd5e1; }
    .boxText { font: bold 17px Arial; fill: #fff; }
    .small { font: 14px Arial; fill: #cbd5e1; }
    .code { font: 14px monospace; fill: #e2e8f0; }

    .box {
      fill: #1e293b;
      stroke-width: 3;
      rx: 16;
      opacity: 0;
      animation: fadeIn 0.6s forwards;
    }

    .arrow {
      stroke: #94a3b8;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      animation: draw 0.8s forwards;
    }

    .pulse {
      animation: pulse 1.4s infinite;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
  </style>

  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="550" y="45" text-anchor="middle" class="title">Package Manager Deep Flow</text>
  <text x="550" y="78" text-anchor="middle" class="sub">npm / Yarn / pnpm install process step-by-step</text>

  <!-- Step 1 -->
  <rect x="70" y="130" width="220" height="95" class="box" stroke="#38bdf8" style="animation-delay:0.2s"/>
  <text x="180" y="165" text-anchor="middle" class="boxText">1. Command</text>
  <text x="180" y="195" text-anchor="middle" class="code">npm install axios</text>

  <!-- Arrow 1 -->
  <line x1="290" y1="178" x2="385" y2="178" class="arrow" marker-end="url(#arrowHead)" style="animation-delay:0.8s"/>

  <!-- Step 2 -->
  <rect x="385" y="130" width="250" height="95" class="box" stroke="#facc15" style="animation-delay:1.3s"/>
  <text x="510" y="165" text-anchor="middle" class="boxText">2. package.json</text>
  <text x="510" y="195" text-anchor="middle" class="small">Reads dependencies</text>

  <!-- Arrow 2 -->
  <line x1="635" y1="178" x2="735" y2="178" class="arrow" marker-end="url(#arrowHead)" style="animation-delay:1.9s"/>

  <!-- Step 3 -->
  <rect x="735" y="130" width="280" height="95" class="box" stroke="#22c55e" style="animation-delay:2.4s"/>
  <text x="875" y="165" text-anchor="middle" class="boxText">3. Version Resolve</text>
  <text x="875" y="195" text-anchor="middle" class="code">axios: ^1.7.0</text>

  <!-- Arrow down -->
  <path d="M875 225 L875 290" class="arrow" marker-end="url(#arrowHead)" style="animation-delay:3s"/>

  <!-- Step 4 -->
  <rect x="735" y="290" width="280" height="105" class="box" stroke="#a78bfa" style="animation-delay:3.5s"/>
  <text x="875" y="325" text-anchor="middle" class="boxText">4. Registry</text>
  <text x="875" y="355" text-anchor="middle" class="small">Downloads package tarball</text>

  <!-- Arrow left -->
  <line x1="735" y1="342" x2="635" y2="342" class="arrow" marker-end="url(#arrowHead)" style="animation-delay:4.1s"/>

  <!-- Step 5 -->
  <rect x="385" y="290" width="250" height="105" class="box" stroke="#fb7185" style="animation-delay:4.6s"/>
  <text x="510" y="325" text-anchor="middle" class="boxText">5. Dependency Tree</text>
  <text x="510" y="355" text-anchor="middle" class="small">Package inside package</text>

  <!-- Arrow left -->
  <line x1="385" y1="342" x2="290" y2="342" class="arrow" marker-end="url(#arrowHead)" style="animation-delay:5.2s"/>

  <!-- Step 6 -->
  <rect x="70" y="290" width="220" height="105" class="box" stroke="#f97316" style="animation-delay:5.7s"/>
  <text x="180" y="325" text-anchor="middle" class="boxText">6. Lock File</text>
  <text x="180" y="355" text-anchor="middle" class="small">Exact versions saved</text>

  <!-- Arrow down -->
  <path d="M180 395 L180 465" class="arrow" marker-end="url(#arrowHead)" style="animation-delay:6.3s"/>

  <!-- Step 7 -->
  <rect x="70" y="465" width="290" height="110" class="box" stroke="#38bdf8" style="animation-delay:6.8s"/>
  <text x="215" y="500" text-anchor="middle" class="boxText">7. node_modules</text>
  <text x="215" y="530" text-anchor="middle" class="small">Packages installed locally</text>

  <!-- Arrow right -->
  <line x1="360" y1="520" x2="470" y2="520" class="arrow" marker-end="url(#arrowHead)" style="animation-delay:7.4s"/>

  <!-- Step 8 -->
  <rect x="470" y="465" width="270" height="110" class="box" stroke="#22c55e" style="animation-delay:7.9s"/>
  <text x="605" y="500" text-anchor="middle" class="boxText">8. Import in Code</text>
  <text x="605" y="530" text-anchor="middle" class="code">import axios from "axios"</text>

  <!-- Arrow right -->
  <line x1="740" y1="520" x2="825" y2="520" class="arrow" marker-end="url(#arrowHead)" style="animation-delay:8.5s"/>

  <!-- Final -->
  <rect x="825" y="465" width="220" height="110" class="box pulse" stroke="#facc15" style="animation-delay:9s"/>
  <text x="935" y="500" text-anchor="middle" class="boxText">App Works</text>
  <text x="935" y="530" text-anchor="middle" class="small">Dependency ready</text>

  <!-- Footer -->
  <rect x="250" y="650" width="600" height="40" rx="12" fill="#334155" opacity="0.95"/>
  <text x="550" y="676" text-anchor="middle" fill="#f8fafc" font-size="15" font-family="Arial">
    Flow: command → package.json → registry → dependency tree → lock file → node_modules → import
  </text>
</svg>