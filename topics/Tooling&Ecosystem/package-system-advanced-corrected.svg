<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript Package System Advanced Corrected Diagram</title>
  <desc id="desc">A clean animated SVG explaining JavaScript package anatomy, package.json, module resolution, TypeScript types, dependency graph, bundling, optimization, runtime, publish flow, and debugging.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#07172f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L10,3 z" fill="#cbd5e1"/>
    </marker>

    <style>
      .title{font:900 42px Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:700 19px Arial,sans-serif;fill:#7dd3fc}
      .section{font:900 21px Arial,sans-serif;fill:#f8fafc}
      .head{font:800 17px Arial,sans-serif;fill:#f8fafc}
      .text{font:15px Arial,sans-serif;fill:#cbd5e1}
      .tiny{font:12px Arial,sans-serif;fill:#cbd5e1}
      .code{font:14px Consolas,monospace;fill:#e2e8f0}
      .code2{font:12px Consolas,monospace;fill:#e2e8f0}
      .panel{fill:rgba(15,23,42,.94);stroke:#64748b;stroke-width:1.5}
      .blue{stroke:#38bdf8}.green{stroke:#22c55e}.yellow{stroke:#facc15}.purple{stroke:#c084fc}.pink{stroke:#fb7185}.orange{stroke:#fb923c}.red{stroke:#ef4444}
      .flow{stroke:#cbd5e1;stroke-width:2.4;fill:none;marker-end:url(#arrow);stroke-dasharray:380;stroke-dashoffset:380}
      .thin{stroke:#94a3b8;stroke-width:1.8;fill:none;marker-end:url(#arrow);stroke-dasharray:250;stroke-dashoffset:250}
      .reveal{opacity:0;transform:translateY(14px);animation:reveal .55s ease forwards}
      .draw{animation:draw .65s ease forwards}
      .pulse{transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
      .scan{animation:scan 2.4s ease-in-out infinite}
      @keyframes reveal{to{opacity:1;transform:translateY(0)}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.65;transform:scale(1.035)}}
      @keyframes scan{0%{transform:translateX(0);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateX(175px);opacity:0}}

      #header{animation-delay:0s}
      #a{animation-delay:.2s}
      #b{animation-delay:.55s}
      #c{animation-delay:.9s}
      #d{animation-delay:1.25s}
      #e{animation-delay:1.6s}
      #f{animation-delay:1.95s}
      #g{animation-delay:2.3s}
      #h{animation-delay:2.65s}
      #i{animation-delay:3s}
      #j{animation-delay:3.35s}
      #k{animation-delay:3.7s}
      #l{animation-delay:4.05s}
      #m{animation-delay:4.4s}
      #n{animation-delay:4.75s}
      #o{animation-delay:5.1s}
      #p{animation-delay:5.45s}
      #q{animation-delay:5.8s}
      #r{animation-delay:6.15s}
      #footer{animation-delay:6.5s}

      #fa{animation-delay:.45s}#fb{animation-delay:.8s}#fc{animation-delay:1.15s}#fd{animation-delay:1.5s}#fe{animation-delay:1.85s}#ff{animation-delay:2.2s}#fg{animation-delay:2.55s}#fh{animation-delay:2.9s}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Header -->
  <g id="header" class="reveal">
    <text x="960" y="54" text-anchor="middle" class="title">JavaScript Package System — Advanced Master Diagram</text>
    <text x="960" y="88" text-anchor="middle" class="subtitle">Understand packages from install → import → resolver → bundle → runtime</text>
    <rect x="600" y="108" width="720" height="34" rx="17" fill="#111827" stroke="#facc15" stroke-width="1.5"/>
    <text x="960" y="131" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#facc15">Clean corrected version: no overlap, structured sections, animated step-by-step</text>
  </g>

  <!-- Top row: concepts -->
  <g id="a" class="reveal">
    <rect x="50" y="170" width="390" height="230" rx="16" class="panel blue"/>
    <text x="80" y="205" class="section" fill="#38bdf8">1. Package Anatomy</text>
    <text x="80" y="235" class="text">A package is a folder with code + metadata.</text>
    <rect x="80" y="255" width="320" height="115" rx="10" fill="#020617" stroke="#334155"/>
    <text x="100" y="278" class="code">axios/</text>
    <text x="120" y="300" class="code">├── package.json</text>
    <text x="120" y="322" class="code">├── dist/</text>
    <text x="120" y="344" class="code">├── index.js</text>
    <text x="120" y="366" class="code">└── index.d.ts</text>
    <text x="80" y="390" class="tiny">package.json is the brain of the package.</text>
  </g>

  <g id="b" class="reveal">
    <rect x="470" y="170" width="450" height="230" rx="16" class="panel purple"/>
    <text x="500" y="205" class="section" fill="#c084fc">2. package.json Fields</text>
    <rect x="500" y="225" width="385" height="135" rx="10" fill="#020617" stroke="#334155"/>
    <text x="520" y="250" class="code2">{</text>
    <text x="535" y="271" class="code2"><tspan fill="#fb7185">"main"</tspan>: "./index.cjs",      <tspan fill="#94a3b8">// CommonJS</tspan></text>
    <text x="535" y="292" class="code2"><tspan fill="#38bdf8">"module"</tspan>: "./dist/esm.js",  <tspan fill="#94a3b8">// ESM</tspan></text>
    <text x="535" y="313" class="code2"><tspan fill="#22c55e">"types"</tspan>: "./index.d.ts",    <tspan fill="#94a3b8">// TS types</tspan></text>
    <text x="535" y="334" class="code2"><tspan fill="#fb923c">"exports"</tspan>: { ".": { ... } },</text>
    <text x="535" y="355" class="code2"><tspan fill="#facc15">"sideEffects"</tspan>: false</text>
    <text x="500" y="386" class="tiny">These fields decide which file tools load.</text>
  </g>

  <g id="c" class="reveal">
    <rect x="950" y="170" width="390" height="230" rx="16" class="panel yellow"/>
    <text x="980" y="205" class="section" fill="#facc15">3. Package Manager</text>
    <text x="980" y="235" class="text">Resolves, downloads, caches, and installs.</text>
    <rect x="980" y="255" width="300" height="90" rx="10" fill="#020617" stroke="#334155"/>
    <text x="1000" y="282" class="code"><tspan fill="#fb7185">npm</tspan> install axios</text>
    <text x="1000" y="309" class="code"><tspan fill="#38bdf8">yarn</tspan> add axios</text>
    <text x="1000" y="336" class="code"><tspan fill="#22c55e">pnpm</tspan> add axios</text>
    <text x="980" y="382" class="tiny">Creates node_modules and updates lock file.</text>
  </g>

  <g id="d" class="reveal">
    <rect x="1370" y="170" width="500" height="230" rx="16" class="panel red"/>
    <text x="1400" y="205" class="section" fill="#f87171">4. Advanced Problems</text>
    <rect x="1400" y="225" width="205" height="52" rx="9" fill="#111827" stroke="#fb7185"/>
    <text x="1420" y="248" class="head" fill="#fb7185">ESM/CJS mismatch</text>
    <text x="1420" y="268" class="tiny">import vs require conflict</text>
    <rect x="1630" y="225" width="210" height="52" rx="9" fill="#111827" stroke="#facc15"/>
    <text x="1650" y="248" class="head" fill="#facc15">Peer conflict</text>
    <text x="1650" y="268" class="tiny">React/plugin version issue</text>
    <rect x="1400" y="295" width="205" height="52" rx="9" fill="#111827" stroke="#38bdf8"/>
    <text x="1420" y="318" class="head" fill="#38bdf8">Missing types</text>
    <text x="1420" y="338" class="tiny">wrong or absent .d.ts</text>
    <rect x="1630" y="295" width="210" height="52" rx="9" fill="#111827" stroke="#22c55e"/>
    <text x="1650" y="318" class="head" fill="#22c55e">Duplicate versions</text>
    <text x="1650" y="338" class="tiny">same lib installed twice</text>
    <text x="1400" y="382" class="tiny">Pro tip: inspect node_modules/package-name/package.json</text>
  </g>

  <!-- Main flow title -->
  <g id="e" class="reveal">
    <rect x="50" y="430" width="1820" height="54" rx="16" class="panel blue"/>
    <text x="80" y="465" class="section" fill="#38bdf8">Main Runtime Resolution Flow</text>
    <text x="420" y="465" class="text">What happens after your code writes: import axios from "axios"</text>
  </g>

  <!-- Main flow boxes row 1 -->
  <g id="f" class="reveal">
    <rect x="70" y="520" width="240" height="95" rx="15" class="panel blue"/>
    <text x="95" y="552" class="section" fill="#38bdf8">5. Import</text>
    <rect x="95" y="570" width="190" height="28" rx="6" fill="#020617" stroke="#334155"/>
    <text x="108" y="590" class="code2">import axios</text>
  </g>
  <path id="fa" class="flow draw" d="M310 567 L375 567"/>

  <g id="g" class="reveal">
    <rect x="375" y="520" width="240" height="95" rx="15" class="panel yellow"/>
    <text x="400" y="552" class="section" fill="#facc15">6. Resolver</text>
    <text x="400" y="580" class="text">Search node_modules</text>
    <text x="400" y="602" class="code2">node_modules/axios</text>
  </g>
  <path id="fb" class="flow draw" d="M615 567 L680 567"/>

  <g id="h" class="reveal">
    <rect x="680" y="520" width="240" height="95" rx="15" class="panel orange"/>
    <text x="705" y="552" class="section" fill="#fb923c">7. Read Brain</text>
    <text x="705" y="580" class="text">Read package.json</text>
    <text x="705" y="602" class="code2">exports/main/module</text>
  </g>
  <path id="fc" class="flow draw" d="M920 567 L985 567"/>

  <g id="i" class="reveal">
    <rect x="985" y="520" width="240" height="95" rx="15" class="panel purple"/>
    <text x="1010" y="552" class="section" fill="#c084fc">8. Pick Entry</text>
    <rect x="1010" y="570" width="80" height="30" rx="7" fill="#020617" stroke="#38bdf8"/>
    <text x="1050" y="590" text-anchor="middle" class="tiny">ESM</text>
    <rect x="1110" y="570" width="80" height="30" rx="7" fill="#020617" stroke="#fb7185"/>
    <text x="1150" y="590" text-anchor="middle" class="tiny">CJS</text>
  </g>
  <path id="fd" class="flow draw" d="M1225 567 L1290 567"/>

  <g id="j" class="reveal">
    <rect x="1290" y="520" width="240" height="95" rx="15" class="panel green"/>
    <text x="1315" y="552" class="section" fill="#22c55e">9. TS Types</text>
    <text x="1315" y="580" class="text">Reads .d.ts</text>
    <text x="1315" y="602" class="code2">types: index.d.ts</text>
  </g>
  <path id="fe" class="flow draw" d="M1530 567 L1595 567"/>

  <g id="k" class="reveal">
    <rect x="1595" y="520" width="240" height="95" rx="15" class="panel pink"/>
    <text x="1620" y="552" class="section" fill="#fb7185">10. Load File</text>
    <text x="1620" y="580" class="text">Correct JS file loads</text>
    <text x="1620" y="602" class="code2">dist/esm.js</text>
  </g>

  <!-- Main flow boxes row 2 -->
  <path id="ff" class="flow draw" d="M1715 615 C1715 660 190 660 190 700"/>

  <g id="l" class="reveal">
    <rect x="70" y="700" width="360" height="155" rx="15" class="panel pink"/>
    <text x="95" y="733" class="section" fill="#fb7185">11. Dependency Graph</text>
    <text x="95" y="760" class="text">A package can import more packages.</text>
    <rect x="100" y="785" width="72" height="30" rx="7" fill="#111827" stroke="#86efac"/>
    <text x="136" y="805" text-anchor="middle" class="tiny">axios</text>
    <path d="M172 800 L245 775 M172 800 L245 825" class="thin draw" style="animation-delay:4.6s"/>
    <rect x="245" y="760" width="120" height="30" rx="7" fill="#111827" stroke="#86efac"/>
    <text x="305" y="780" text-anchor="middle" class="tiny">follow-redirects</text>
    <rect x="245" y="810" width="80" height="30" rx="7" fill="#111827" stroke="#86efac"/>
    <text x="285" y="830" text-anchor="middle" class="tiny">form-data</text>
  </g>
  <path id="fg" class="flow draw" d="M430 778 L515 778"/>

  <g id="m" class="reveal">
    <rect x="515" y="700" width="300" height="155" rx="15" class="panel yellow"/>
    <text x="540" y="733" class="section" fill="#facc15">12. Bundler</text>
    <text x="540" y="760" class="text">Next.js / Webpack / Vite</text>
    <rect x="540" y="785" width="74" height="38" rx="8" fill="#020617" stroke="#38bdf8"/>
    <text x="577" y="809" text-anchor="middle" class="tiny">resolve</text>
    <rect x="630" y="785" width="74" height="38" rx="8" fill="#020617" stroke="#c084fc"/>
    <text x="667" y="809" text-anchor="middle" class="tiny">bundle</text>
    <rect x="720" y="785" width="74" height="38" rx="8" fill="#020617" stroke="#22c55e"/>
    <text x="757" y="809" text-anchor="middle" class="tiny">optimize</text>
  </g>
  <path id="fh" class="flow draw" d="M815 778 L900 778"/>

  <g id="n" class="reveal">
    <rect x="900" y="700" width="300" height="155" rx="15" class="panel green"/>
    <text x="925" y="733" class="section" fill="#22c55e">13. Optimization</text>
    <text x="925" y="760" class="text">Tree shaking removes unused code.</text>
    <rect x="925" y="785" width="230" height="36" rx="8" fill="#020617" stroke="#334155"/>
    <text x="945" y="808" class="code2">"sideEffects": false</text>
    <text x="925" y="840" class="tiny">Smaller bundle = faster app.</text>
  </g>
  <path class="flow draw" style="animation-delay:3.25s" d="M1200 778 L1285 778"/>

  <g id="o" class="reveal">
    <rect x="1285" y="700" width="270" height="155" rx="15" class="panel blue"/>
    <text x="1310" y="733" class="section" fill="#38bdf8">14. Final Bundle</text>
    <text x="1310" y="760" class="text">Optimized JS output.</text>
    <rect x="1310" y="785" width="95" height="36" rx="8" fill="#020617" stroke="#38bdf8"/>
    <text x="1357" y="809" text-anchor="middle" class="tiny">client</text>
    <rect x="1420" y="785" width="95" height="36" rx="8" fill="#020617" stroke="#facc15"/>
    <text x="1467" y="809" text-anchor="middle" class="tiny">server</text>
  </g>
  <path class="flow draw" style="animation-delay:3.6s" d="M1555 778 L1625 778"/>

  <g id="p" class="reveal">
    <rect x="1625" y="700" width="245" height="155" rx="15" class="panel green"/>
    <text x="1650" y="733" class="section" fill="#22c55e">15. Runtime</text>
    <text x="1650" y="760" class="text">App runs with resolved code.</text>
    <circle class="pulse" cx="1747" cy="810" r="28" fill="#14532d" stroke="#86efac" stroke-width="2"/>
    <text x="1747" y="819" text-anchor="middle" font-size="28" fill="#86efac">✓</text>
  </g>

  <!-- Bottom panels -->
  <g id="q" class="reveal">
    <rect x="50" y="890" width="570" height="120" rx="16" class="panel orange"/>
    <text x="80" y="925" class="section" fill="#fb923c">Package Publish Flow</text>
    <text x="80" y="955" class="text">TS source → build → dist/ → package.json points to output → npm publish → registry → install</text>
    <rect x="80" y="975" width="90" height="24" rx="7" fill="#111827" stroke="#fb923c"/>
    <text x="125" y="992" text-anchor="middle" class="tiny">source</text>
    <rect x="205" y="975" width="90" height="24" rx="7" fill="#111827" stroke="#facc15"/>
    <text x="250" y="992" text-anchor="middle" class="tiny">dist</text>
    <rect x="330" y="975" width="90" height="24" rx="7" fill="#111827" stroke="#38bdf8"/>
    <text x="375" y="992" text-anchor="middle" class="tiny">registry</text>
    <rect x="455" y="975" width="90" height="24" rx="7" fill="#111827" stroke="#22c55e"/>
    <text x="500" y="992" text-anchor="middle" class="tiny">install</text>
  </g>

  <g id="r" class="reveal">
    <rect x="650" y="890" width="570" height="120" rx="16" class="panel purple"/>
    <text x="680" y="925" class="section" fill="#c084fc">Pro Debug Commands</text>
    <text x="680" y="960" class="code"><tspan fill="#38bdf8">npm ls</tspan>  |  <tspan fill="#facc15">npm outdated</tspan>  |  <tspan fill="#fb7185">npm audit</tspan>  |  <tspan fill="#22c55e">npm dedupe</tspan></text>
    <text x="680" y="990" class="tiny">Use when versions, security, duplicate packages, or peer deps create issues.</text>
  </g>

  <g class="reveal" style="animation-delay:6.25s">
    <rect x="1250" y="890" width="620" height="120" rx="16" class="panel blue"/>
    <text x="1280" y="925" class="section" fill="#38bdf8">Mental Model</text>
    <text x="1280" y="958" class="text">Package = code + metadata + types + dependencies + build output + runtime behavior.</text>
    <text x="1280" y="988" class="tiny">Best debugging habit: open package.json inside node_modules and inspect fields.</text>
  </g>

  <!-- Footer -->
  <g id="footer" class="reveal">
    <rect x="50" y="1030" width="1820" height="40" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="960" y="1056" text-anchor="middle" class="head">
      MASTER FLOW: install → package.json → lock file → node_modules → import → resolver → exports/main/module/types → dependency graph → bundler → tree shaking → final bundle → runtime
    </text>
  </g>
</svg>