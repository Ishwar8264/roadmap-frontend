<svg width="920" height="460" viewBox="0 0 920 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="920" height="460" fill="#111827"/>

  <text x="460" y="45" text-anchor="middle" fill="#fff" font-size="28" font-family="Arial" font-weight="bold">
    Package Manager Flow
  </text>

  <!-- Dev -->
  <rect x="100" y="160" width="200" height="100" rx="16" fill="#1f2937" stroke="#38bdf8" stroke-width="3"/>
  <text x="200" y="210" text-anchor="middle" fill="#38bdf8" font-size="18">Developer</text>

  <!-- Command -->
  <rect x="360" y="150" width="200" height="120" rx="16" fill="#1f2937" stroke="#facc15" stroke-width="3"/>
  <text x="460" y="200" text-anchor="middle" fill="#facc15" font-size="16">npm install</text>
  <text x="460" y="230" text-anchor="middle" fill="#facc15" font-size="16">yarn add</text>

  <!-- Registry -->
  <rect x="640" y="160" width="200" height="100" rx="16" fill="#1f2937" stroke="#22c55e" stroke-width="3"/>
  <text x="740" y="210" text-anchor="middle" fill="#22c55e" font-size="18">NPM Registry</text>

  <!-- Arrows -->
  <line x1="300" y1="210" x2="360" y2="210" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="210" x2="640" y2="210" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="260" y="340" width="400" height="40" rx="10" fill="#374151"/>
  <text x="460" y="365" text-anchor="middle" fill="#f9fafb" font-size="15">
    Downloads packages → adds to node_modules
  </text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>