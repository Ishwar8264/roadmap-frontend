<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="460" fill="#111827"/>

  <text x="450" y="55" text-anchor="middle" fill="#ffffff" font-size="30" font-family="Arial" font-weight="700">
    Flexbox Layout
  </text>

  <rect x="100" y="120" width="700" height="190" rx="20" fill="#1f2937" stroke="#60a5fa" stroke-width="4"/>

  <rect x="155" y="175" width="130" height="80" rx="14" fill="#bfdbfe"/>
  <rect x="385" y="175" width="130" height="80" rx="14" fill="#bfdbfe"/>
  <rect x="615" y="175" width="130" height="80" rx="14" fill="#bfdbfe"/>

  <text x="220" y="224" text-anchor="middle" fill="#1e3a8a" font-size="22" font-family="Arial" font-weight="700">Item 1</text>
  <text x="450" y="224" text-anchor="middle" fill="#1e3a8a" font-size="22" font-family="Arial" font-weight="700">Item 2</text>
  <text x="680" y="224" text-anchor="middle" fill="#1e3a8a" font-size="22" font-family="Arial" font-weight="700">Item 3</text>

  <line x1="155" y1="340" x2="745" y2="340" stroke="#facc15" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="450" y="380" text-anchor="middle" fill="#facc15" font-size="20" font-family="Arial">
    Main Axis: row direction
  </text>

  <text x="450" y="425" text-anchor="middle" fill="#cbd5e1" font-size="18" font-family="Arial">
    Best for one-dimensional layout: row OR column
  </text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#facc15"/>
    </marker>
  </defs>
</svg>