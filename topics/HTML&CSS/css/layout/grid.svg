<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="560" fill="#0f172a"/>

  <text x="450" y="55" text-anchor="middle" fill="#ffffff" font-size="30" font-family="Arial" font-weight="700">
    CSS Grid Layout
  </text>

  <rect x="140" y="110" width="620" height="330" rx="20" fill="#1e293b" stroke="#22c55e" stroke-width="4"/>

  <g fill="#bbf7d0" stroke="#16a34a" stroke-width="3">
    <rect x="175" y="145" width="170" height="85" rx="12"/>
    <rect x="365" y="145" width="170" height="85" rx="12"/>
    <rect x="555" y="145" width="170" height="85" rx="12"/>

    <rect x="175" y="250" width="170" height="85" rx="12"/>
    <rect x="365" y="250" width="170" height="85" rx="12"/>
    <rect x="555" y="250" width="170" height="85" rx="12"/>

    <rect x="175" y="355" width="170" height="55" rx="12"/>
    <rect x="365" y="355" width="170" height="55" rx="12"/>
    <rect x="555" y="355" width="170" height="55" rx="12"/>
  </g>

  <text x="260" y="198" text-anchor="middle" fill="#14532d" font-size="20" font-family="Arial" font-weight="700">Card 1</text>
  <text x="450" y="198" text-anchor="middle" fill="#14532d" font-size="20" font-family="Arial" font-weight="700">Card 2</text>
  <text x="640" y="198" text-anchor="middle" fill="#14532d" font-size="20" font-family="Arial" font-weight="700">Card 3</text>

  <line x1="175" y1="470" x2="725" y2="470" stroke="#facc15" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="450" y="505" text-anchor="middle" fill="#facc15" font-size="19" font-family="Arial">
    Columns + Rows together
  </text>

  <text x="450" y="535" text-anchor="middle" fill="#cbd5e1" font-size="17" font-family="Arial">
    Best for two-dimensional layout: rows AND columns
  </text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#facc15"/>
    </marker>
  </defs>
</svg>