<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="560" fill="#0f172a"/>

  <text x="450" y="55" text-anchor="middle" fill="#ffffff" font-size="30" font-family="Arial" font-weight="700">
    CSS Box Model
  </text>

  <rect x="120" y="95" width="660" height="380" rx="22" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
  <text x="450" y="130" text-anchor="middle" fill="#991b1b" font-size="24" font-family="Arial" font-weight="700">
    Margin
  </text>

  <rect x="185" y="160" width="530" height="260" rx="18" fill="#fed7aa" stroke="#f97316" stroke-width="4"/>
  <text x="450" y="195" text-anchor="middle" fill="#9a3412" font-size="24" font-family="Arial" font-weight="700">
    Border
  </text>

  <rect x="250" y="225" width="400" height="150" rx="14" fill="#bfdbfe" stroke="#3b82f6" stroke-width="4"/>
  <text x="450" y="260" text-anchor="middle" fill="#1e40af" font-size="24" font-family="Arial" font-weight="700">
    Padding
  </text>

  <rect x="330" y="285" width="240" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
  <text x="450" y="323" text-anchor="middle" fill="#166534" font-size="22" font-family="Arial" font-weight="700">
    Content
  </text>

  <text x="450" y="515" text-anchor="middle" fill="#cbd5e1" font-size="18" font-family="Arial">
    Total space = content + padding + border + margin
  </text>
</svg>