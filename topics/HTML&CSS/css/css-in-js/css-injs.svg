<svg width="1000" height="660" viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="660" fill="#0f172a"/>

  <text x="500" y="55" text-anchor="middle" fill="#ffffff" font-size="32" font-family="Arial" font-weight="700">
    CSS-in-JS Architecture
  </text>

  <text x="500" y="88" text-anchor="middle" fill="#cbd5e1" font-size="18" font-family="Arial">
    Styling React components directly using JavaScript or TypeScript
  </text>

  <!-- React Component -->
  <rect x="120" y="160" width="240" height="120" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <text x="240" y="210" text-anchor="middle" fill="#7dd3fc" font-size="28" font-family="Arial" font-weight="700">
    React Component
  </text>

  <text x="240" y="248" text-anchor="middle" fill="#e2e8f0" font-size="18" font-family="Arial">
    JSX + Logic + Styles
  </text>

  <!-- Arrow -->
  <line x1="360" y1="220" x2="470" y2="220" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- CSS-in-JS Engine -->
  <rect x="470" y="140" width="260" height="160" rx="24" fill="#111827" stroke="#f472b6" stroke-width="4"/>

  <text x="600" y="190" text-anchor="middle" fill="#f9a8d4" font-size="28" font-family="Arial" font-weight="700">
    styled-components
  </text>

  <text x="600" y="225" text-anchor="middle" fill="#e2e8f0" font-size="18" font-family="Arial">
    Emotion
  </text>

  <text x="600" y="265" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="Arial">
    Generates unique CSS classes
  </text>

  <!-- Arrow -->
  <line x1="730" y1="220" x2="840" y2="220" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Browser -->
  <rect x="840" y="160" width="120" height="120" rx="20" fill="#1e293b" stroke="#22c55e" stroke-width="4"/>
  <text x="900" y="210" text-anchor="middle" fill="#bbf7d0" font-size="26" font-family="Arial" font-weight="700">
    Browser
  </text>

  <text x="900" y="245" text-anchor="middle" fill="#e2e8f0" font-size="16" font-family="Arial">
    Inject CSS
  </text>

  <!-- Bottom Cards -->
  <rect x="110" y="400" width="220" height="140" rx="20" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
  <text x="220" y="445" text-anchor="middle" fill="#7dd3fc" font-size="22" font-family="Arial" font-weight="700">
    Dynamic Styling
  </text>

  <text x="220" y="485" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="Arial">
    Styles based
  </text>

  <text x="220" y="510" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="Arial">
    on component props
  </text>

  <rect x="390" y="400" width="220" height="140" rx="20" fill="#111827" stroke="#facc15" stroke-width="3"/>
  <text x="500" y="445" text-anchor="middle" fill="#fde68a" font-size="22" font-family="Arial" font-weight="700">
    Scoped Styles
  </text>

  <text x="500" y="485" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="Arial">
    Prevent global
  </text>

  <text x="500" y="510" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="Arial">
    CSS conflicts
  </text>

  <rect x="670" y="400" width="220" height="140" rx="20" fill="#111827" stroke="#22c55e" stroke-width="3"/>
  <text x="780" y="445" text-anchor="middle" fill="#bbf7d0" font-size="22" font-family="Arial" font-weight="700">
    Theme System
  </text>

  <text x="780" y="485" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="Arial">
    Easy dark mode
  </text>

  <text x="780" y="510" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="Arial">
    and branding
  </text>

  <!-- Bottom Note -->
  <rect x="180" y="585" width="640" height="42" rx="14" fill="#111827" stroke="#64748b" stroke-width="2"/>
  <text x="500" y="612" text-anchor="middle" fill="#e2e8f0" font-size="17" font-family="Arial">
    Modern trend: Tailwind + reusable components + minimal runtime styling
  </text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>