<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="560" fill="#f8fafc"/>

  <text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#111827">
    Reconciliation: Old Tree vs New Tree
  </text>

  <text x="250" y="95" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#9a3412">
    Old Virtual Tree
  </text>

  <text x="750" y="95" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#166534">
    New Virtual Tree
  </text>

  <!-- Old Tree -->
  <circle cx="250" cy="150" r="42" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="250" y="156" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#9a3412">div</text>

  <line x1="225" y1="185" x2="150" y2="250" stroke="#9a3412" stroke-width="2"/>
  <line x1="275" y1="185" x2="350" y2="250" stroke="#9a3412" stroke-width="2"/>

  <circle cx="150" cy="280" r="42" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="150" y="286" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#9a3412">h1</text>

  <circle cx="350" cy="280" r="42" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="350" y="286" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#9a3412">button</text>

  <rect x="90" y="360" width="120" height="46" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="150" y="389" text-anchor="middle" font-family="Arial" font-size="15" fill="#9a3412">Count: 0</text>

  <rect x="290" y="360" width="120" height="46" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="350" y="389" text-anchor="middle" font-family="Arial" font-size="15" fill="#9a3412">Increase</text>

  <line x1="150" y1="322" x2="150" y2="360" stroke="#9a3412" stroke-width="2"/>
  <line x1="350" y1="322" x2="350" y2="360" stroke="#9a3412" stroke-width="2"/>

  <!-- New Tree -->
  <circle cx="750" cy="150" r="42" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/>
  <text x="750" y="156" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#166534">div</text>

  <line x1="725" y1="185" x2="650" y2="250" stroke="#166534" stroke-width="2"/>
  <line x1="775" y1="185" x2="850" y2="250" stroke="#166534" stroke-width="2"/>

  <circle cx="650" cy="280" r="42" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/>
  <text x="650" y="286" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#166534">h1</text>

  <circle cx="850" cy="280" r="42" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/>
  <text x="850" y="286" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#166534">button</text>

  <rect x="590" y="360" width="120" height="46" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="650" y="389" text-anchor="middle" font-family="Arial" font-size="15" fill="#166534">Count: 1</text>

  <rect x="790" y="360" width="120" height="46" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="850" y="389" text-anchor="middle" font-family="Arial" font-size="15" fill="#166534">Increase</text>

  <line x1="650" y1="322" x2="650" y2="360" stroke="#166534" stroke-width="2"/>
  <line x1="850" y1="322" x2="850" y2="360" stroke="#166534" stroke-width="2"/>

  <!-- Center comparison -->
  <line x1="430" y1="280" x2="570" y2="280" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="500" y="250" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#334155">
    compare
  </text>

  <rect x="310" y="455" width="380" height="60" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="480" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#111827">
    Result
  </text>
  <text x="500" y="505" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">
    div, h1, button same. Only text changes: Count 0 → Count 1
  </text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>