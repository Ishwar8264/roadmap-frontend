<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="430" fill="#0f172a"/>
  <text x="450" y="45" text-anchor="middle" fill="#fff" font-size="28" font-family="Arial" font-weight="bold">TypeScript Modules</text>
  <text x="450" y="78" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="Arial">Each file can export code and another file can import it</text>

  <rect x="80" y="130" width="300" height="190" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="230" y="165" text-anchor="middle" fill="#38bdf8" font-size="22" font-family="Arial" font-weight="bold">user.ts</text>
  <text x="110" y="215" fill="#e2e8f0" font-size="17" font-family="monospace">export type User</text>
  <text x="110" y="250" fill="#e2e8f0" font-size="17" font-family="monospace">export function</text>

  <line x1="400" y1="225" x2="500" y2="225" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="205" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial">import</text>

  <rect x="530" y="130" width="300" height="190" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="680" y="165" text-anchor="middle" fill="#22c55e" font-size="22" font-family="Arial" font-weight="bold">profile.ts</text>
  <text x="560" y="215" fill="#e2e8f0" font-size="17" font-family="monospace">import { User }</text>
  <text x="560" y="250" fill="#e2e8f0" font-size="17" font-family="monospace">use getUserName()</text>

  <rect x="230" y="360" width="440" height="38" rx="10" fill="#334155"/>
  <text x="450" y="385" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="Arial">Modern TypeScript / Next.js mainly uses modules</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>