<svg width="920" height="500" viewBox="0 0 920 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="920" height="500" fill="#0f172a"/>

  <text x="460" y="45" text-anchor="middle" fill="#ffffff" font-size="30" font-family="Arial" font-weight="bold">
    TypeScript Generics
  </text>

  <text x="460" y="78" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="Arial">
    Generic means reusable type. Type is decided when you use it.
  </text>

  <rect x="70" y="120" width="310" height="240" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="225" y="155" text-anchor="middle" fill="#38bdf8" font-size="22" font-family="Arial" font-weight="bold">
    Generic Type
  </text>

  <text x="100" y="205" fill="#e2e8f0" font-size="17" font-family="monospace">interface ApiResponse&lt;T&gt; {</text>
  <text x="120" y="238" fill="#e2e8f0" font-size="17" font-family="monospace">success: boolean;</text>
  <text x="120" y="271" fill="#facc15" font-size="17" font-family="monospace">data: T;</text>
  <text x="120" y="304" fill="#e2e8f0" font-size="17" font-family="monospace">message: string;</text>
  <text x="100" y="337" fill="#e2e8f0" font-size="17" font-family="monospace">}</text>

  <line x1="400" y1="240" x2="510" y2="240" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="455" y="222" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial">
    T becomes User
  </text>

  <rect x="540" y="120" width="310" height="240" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="695" y="155" text-anchor="middle" fill="#22c55e" font-size="22" font-family="Arial" font-weight="bold">
    Usage Example
  </text>

  <text x="570" y="205" fill="#e2e8f0" font-size="17" font-family="monospace">type User = {</text>
  <text x="590" y="238" fill="#e2e8f0" font-size="17" font-family="monospace">id: string;</text>
  <text x="590" y="271" fill="#e2e8f0" font-size="17" font-family="monospace">name: string;</text>
  <text x="570" y="304" fill="#e2e8f0" font-size="17" font-family="monospace">}</text>
  <text x="570" y="337" fill="#facc15" font-size="17" font-family="monospace">ApiResponse&lt;User&gt;</text>

  <rect x="210" y="405" width="500" height="45" rx="12" fill="#334155"/>
  <text x="460" y="434" text-anchor="middle" fill="#f8fafc" font-size="17" font-family="Arial">
    Best for API responses, reusable functions, and reusable components
  </text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>