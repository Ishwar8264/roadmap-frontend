<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="420" fill="#0f172a"/>

  <text x="450" y="45" text-anchor="middle" fill="#fff" font-size="28" font-family="Arial" font-weight="bold">
    tsconfig.json
  </text>

  <rect x="120" y="120" width="260" height="200" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="250" y="155" text-anchor="middle" fill="#38bdf8" font-size="20">tsconfig.json</text>

  <text x="150" y="200" fill="#e2e8f0" font-size="15">target: ES2020</text>
  <text x="150" y="230" fill="#e2e8f0" font-size="15">module: ESNext</text>
  <text x="150" y="260" fill="#facc15" font-size="15">strict: true</text>

  <line x1="400" y1="220" x2="520" y2="220" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="550" y="120" width="250" height="200" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="675" y="155" text-anchor="middle" fill="#22c55e" font-size="20">TypeScript</text>

  <text x="580" y="220" fill="#e2e8f0" font-size="15">Checks your code</text>
  <text x="580" y="250" fill="#e2e8f0" font-size="15">Applies rules</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>